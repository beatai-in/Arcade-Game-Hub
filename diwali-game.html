<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Diwali Festival Game - Stages 1, 2 & 3</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #120326;
            color: #FFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: linear-gradient(180deg, #1a0b2e 0%, #311448 100%);
            border: 3px solid #ffd700;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            overflow: hidden;
        }
        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        #play-area {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }
        
        /* Common Interactive Elements */
        .game-item {
            position: absolute;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }
        .game-item:active { transform: scale(0.85); }

        /* Stage 1: Diya */
        .diya { width: 50px; height: 50px; }
        .diya-base {
            width: 40px; height: 20px;
            background: #a04000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border: 2px solid #d35400;
            position: absolute; bottom: 5px;
        }
        .wick { width: 4px; height: 8px; background: #555; position: absolute; top: 18px; }
        .flame {
            width: 14px; height: 22px;
            background: radial-gradient(circle, #fff 10%, #ffd700 50%, #ff4500 100%);
            border-radius: 50% 50% 20% 20% / 80% 80% 30% 30%;
            position: absolute; top: 2px; display: none;
            box-shadow: 0 0 15px #ffd700, 0 0 25px #ff4500;
        }
        .lit .flame { display: block; }

        /* Stage 2 & 3 Items */
        .cracker { font-size: 2.2rem; width: 55px; height: 55px; }
        
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 3, 38, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        button {
            background: linear-gradient(45deg, #ff9900, #ff5500);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(255, 85, 0, 0.4);
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1 id="stage-title">🪔 Stage 1: Roshni Ki Shuruat</h1>
        <div class="stats">
            <div>Score: <span id="score">0</span> / <span id="target-score">10</span></div>
            <div>Time: <span id="timer">15</span>s</div>
        </div>
    </header>

    <div id="play-area"></div>

    <div id="overlay">
        <h2 id="overlay-title" style="color: #ffd700;">Light the Diyas!</h2>
        <p id="overlay-desc">Tap unlit diyas quickly before time runs out!</p>
        <button id="start-btn" onclick="playStartMelodyAndInit()">Start Game</button>
    </div>
</div>

<script>
    // --- ADVANCED WEB AUDIO API SOUND ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const now = audioCtx.currentTime;

        if (type === 'start') {
            // Joyful festive starting chime (Arpeggio)
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + index * 0.08);
                gain.gain.setValueAtTime(0.2, now + index * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.08);
                osc.stop(now + index * 0.08 + 0.25);
            });
            return;
        }

        if (type === 'gameover') {
            // Sad descending buzzer for Game Over
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
            return;
        }

        if (type === 'diya') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
            return;
        }

        const bufferSize = audioCtx.sampleRate * 0.6;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        const gainNode = audioCtx.createGain();

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'sparkler') {
            filter.type = 'highpass';
            filter.frequency.setValueAtTime(3000, now);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            noise.start(now);
            noise.stop(now + 0.3);
        } 
        else if (type === 'rocket') {
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1600, now + 0.25);
            osc.frequency.setValueAtTime(200, now + 0.25);
            
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            
            oscGain.gain.setValueAtTime(0.25, now);
            oscGain.gain.linearRampToValueAtTime(0, now + 0.45);
            
            osc.start(now);
            osc.stop(now + 0.45);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2500, now + 0.25);
            gainNode.gain.setValueAtTime(0.4, now + 0.25);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            noise.start(now + 0.25);
            noise.stop(now + 0.5);
        } 
        else if (type === 'bomb') {
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, now);
            filter.frequency.linearRampToValueAtTime(40, now + 0.5);

            gainNode.gain.setValueAtTime(0.95, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

            noise.start(now);
            noise.stop(now + 0.5);
        }
        else if (type === 'series') {
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1400, now);
            gainNode.gain.setValueAtTime(0.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            noise.start(now);
            noise.stop(now + 0.3);
        }
    }

    // --- GAME LOGIC ---
    let currentStage = 1;
    let score = 0;
    let targetScore = 10;
    let timeLeft = 15;
    let gameInterval, timerInterval;
    
    const playArea = document.getElementById('play-area');
    const scoreEl = document.getElementById('score');
    const targetScoreEl = document.getElementById('target-score');
    const timerEl = document.getElementById('timer');
    const stageTitle = document.getElementById('stage-title');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');

    function playStartMelodyAndInit() {
        playSound('start');
        initGame();
    }

    function initGame() {
        currentStage = 1;
        startStage1();
    }

    // --- STAGE 1: LIGHT THE DIYAS ---
    function startStage1() {
        score = 0;
        targetScore = 10;
        timeLeft = 15;
        updateStats();
        stageTitle.textContent = "🪔 Stage 1: Roshni Ki Shuruat";
        overlay.style.display = 'none';
        playArea.innerHTML = '';

        gameInterval = setInterval(spawnDiya, 700);
        startTimer(stage1Win, stageLoss);
    }

    function spawnDiya() {
        if (playArea.children.length >= 6) return;
        const diya = document.createElement('div');
        diya.className = 'game-item diya';

        setRandomPosition(diya);
        diya.innerHTML = `<div class="flame"></div><div class="wick"></div><div class="diya-base"></div>`;

        const lightDiya = (e) => {
            e.preventDefault();
            if (!diya.classList.contains('lit')) {
                diya.classList.add('lit');
                playSound('diya');
                score++;
                updateStats();
                setTimeout(() => diya.remove(), 250);

                if (score >= targetScore) {
                    clearAllIntervals();
                    stage1Win();
                }
            }
        };

        diya.addEventListener('touchstart', lightDiya);
        diya.addEventListener('mousedown', lightDiya);
        playArea.appendChild(diya);

        setTimeout(() => { if (diya.parentNode && !diya.classList.contains('lit')) diya.remove(); }, 2200);
    }

    function stage1Win() {
        overlay.style.display = 'flex';
        overlayTitle.textContent = "✨ Stage 1 Cleared! ✨";
        overlayDesc.textContent = "Courtyard is lit! Watch out for sweets in Stage 2!";
        startBtn.textContent = "Start Stage 2";
        startBtn.onclick = startStage2;
    }

    // --- STAGE 2: PATAKHE & SWEETS TRAP ---
    function startStage2() {
        currentStage = 2;
        score = 0;
        targetScore = 15;
        timeLeft = 18;
        updateStats();
        stageTitle.textContent = "🎆 Stage 2: Sparklers & Sweets Trap";
        overlay.style.display = 'none';
        playArea.innerHTML = '';

        gameInterval = setInterval(spawnStage2Item, 600);
        startTimer(stage2Win, stageLoss);
    }

    function spawnStage2Item() {
        if (playArea.children.length >= 5) return;
        const item = document.createElement('div');
        item.className = 'game-item cracker';

        // 25% chance to spawn a sweet (Trap)
        const isSweet = Math.random() < 0.25;
        const types = isSweet ? ['🍬', '🧁', '🍫', '🍩'] : ['🎇', '✨', '⭐', '🌟'];
        const selectedIcon = types[Math.floor(Math.random() * types.length)];
        
        item.textContent = selectedIcon;
        setRandomPosition(item);

        const handleTap = (e) => {
            e.preventDefault();
            if (isSweet) {
                // Clicking a sweet triggers Game Over!
                clearAllIntervals();
                playSound('gameover');
                triggerGameOver("Oops! You tapped a sweet instead of bursting crackers!");
            } else {
                item.textContent = '💥';
                playSound('sparkler');
                score++;
                updateStats();
                setTimeout(() => item.remove(), 150);

                if (score >= targetScore) {
                    clearAllIntervals();
                    stage2Win();
                }
            }
        };

        item.addEventListener('touchstart', handleTap);
        item.addEventListener('mousedown', handleTap);
        playArea.appendChild(item);

        setTimeout(() => { if (item.parentNode) item.remove(); }, 1800);
    }

    function stage2Win() {
        overlay.style.display = 'flex';
        overlayTitle.textContent = "🌟 Stage 2 Cleared! 🌟";
        overlayDesc.textContent = "Great job avoiding the sweets! Get ready for the Grand Finale!";
        startBtn.textContent = "Start Stage 3 (Grand Finale)";
        startBtn.onclick = startStage3;
    }

    // --- STAGE 3: SKY SHOTS & SWEETS TRAP ---
    function startStage3() {
        currentStage = 3;
        score = 0;
        targetScore = 18;
        timeLeft = 20;
        updateStats();
        stageTitle.textContent = "🚀 Stage 3: Sky Shots & Sweets Trap";
        overlay.style.display = 'none';
        playArea.innerHTML = '';

        gameInterval = setInterval(spawnStage3Item, 550);
        startTimer(stage3Win, stageLoss);
    }

    function spawnStage3Item() {
        if (playArea.children.length >= 5) return;
        const item = document.createElement('div');
        item.className = 'game-item cracker';

        const isSweet = Math.random() < 0.25;
        
        let selected;
        if (isSweet) {
            const sweets = ['🍬', '🧁', '🍫', '🍩', '🍡'];
            selected = { icon: sweets[Math.floor(Math.random() * sweets.length)], isSweet: true };
        } else {
            const crackerTypes = [
                { icon: '🚀', sound: 'rocket', isRocket: true },
                { icon: '🎆', sound: 'bomb' },
                { icon: '🧨', sound: 'series' },
                { icon: '💣', sound: 'bomb' },
                { icon: '✨', sound: 'sparkler' }
            ];
            selected = crackerTypes[Math.floor(Math.random() * crackerTypes.length)];
        }

        item.textContent = selected.icon;
        setRandomPosition(item);

        const handleTap = (e) => {
            e.preventDefault();

            if (selected.isSweet) {
                clearAllIntervals();
                playSound('gameover');
                triggerGameOver("Oh no! You touched the festive mithai box! Game Over!");
                return;
            }

            if (selected.isRocket) {
                item.textContent = '✨';
                item.style.transition = 'transform 0.3s ease-out, opacity 0.3s';
                item.style.transform = 'translateY(-80px) scale(1.3)';
                setTimeout(() => { item.textContent = '🌟'; }, 150);
            } else {
                item.textContent = '🌟';
            }

            playSound(selected.sound);
            score++;
            updateStats();
            setTimeout(() => item.remove(), 250);

            if (score >= targetScore) {
                clearAllIntervals();
                stage3Win();
            }
        };

        item.addEventListener('touchstart', handleTap);
        item.addEventListener('mousedown', handleTap);
        playArea.appendChild(item);

        setTimeout(() => { if (item.parentNode) item.remove(); }, 1600);
    }

    function stage3Win() {
        overlay.style.display = 'flex';
        overlayTitle.textContent = "🏆 Happy Diwali! Master Blaster! 🎆";
        overlayDesc.textContent = `Incredible job! You successfully completed all 3 stages with ${timeLeft}s left!`;
        startBtn.textContent = "Play Again from Stage 1";
        startBtn.onclick = playStartMelodyAndInit;
    }

    function triggerGameOver(message) {
        overlay.style.display = 'flex';
        overlayTitle.textContent = "❌ GAME OVER ❌";
        overlayDesc.textContent = message;
        startBtn.textContent = "Try Again";
        if (currentStage === 2) startBtn.onclick = startStage2;
        else startBtn.onclick = startStage3;
    }

    // --- UTILITIES ---
    function setRandomPosition(element) {
        const maxX = playArea.clientWidth - 65;
        const maxY = playArea.clientHeight - 65;
        element.style.left = `${Math.max(10, Math.floor(Math.random() * maxX))}px`;
        element.style.top = `${Math.max(10, Math.floor(Math.random() * maxY))}px`;
    }

    function updateStats() {
        scoreEl.textContent = score;
        targetScoreEl.textContent = targetScore;
        timerEl.textContent = timeLeft;
    }

    function startTimer(onWin, onLoss) {
        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearAllIntervals();
                playSound('gameover');
                onLoss();
            }
        }, 1000);
    }

    function clearAllIntervals() {
        clearInterval(gameInterval);
        clearInterval(timerInterval);
    }

    function stageLoss() {
        overlay.style.display = 'flex';
        overlayTitle.textContent = "💥 Time's Up!";
        overlayDesc.textContent = `You scored ${score} out of ${targetScore}. Give it another shot!`;
        startBtn.textContent = "Retry Stage";
        if (currentStage === 1) startBtn.onclick = startStage1;
        else if (currentStage === 2) startBtn.onclick = startStage2;
        else startBtn.onclick = startStage3;
    }
</script>

</body>
</html>
